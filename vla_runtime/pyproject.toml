[project]
name = "venture-launch-agent"
version = "0.5.0"
description = "Autonomous venture launch, business-growth, and agent-economy operator built on Venture Launch OS"
requires-python = ">=3.11"
dependencies = [
  "openai-agents[any-llm]>=0.4.0",
  "pydantic>=2.8.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "httpx>=0.27.0"
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
gemini = ["google-genai>=1.0.0"]
xai = ["openai>=1.0.0"]
all-providers = [
  "anthropic>=0.40.0",
  "google-genai>=1.0.0",
  "openai>=1.0.0"
]

[project.scripts]
vla = "main:cli"

[tool.uv]
dev-dependencies = ["pytest>=8.0.0"]
