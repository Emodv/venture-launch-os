name: VLA Runtime CI

on:
  push:
    paths:
      - "vla_runtime/**"
      - ".github/workflows/vla-runtime-ci.yml"
  pull_request:
    paths:
      - "vla_runtime/**"
      - ".github/workflows/vla-runtime-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vla_runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Compile runtime
        run: python -m compileall -q .
      - name: Run tests
        run: pytest -q evals/test_approvals.py evals/test_entry_modes.py
