name: VLA Runtime CI

on:
  push:
    paths:
      - "vla_runtime/**"
      - "templates/AGENT_CAPABILITY_MANIFEST.schema.json"
      - "templates/AGENT_VERIFICATION_RECEIPT.schema.json"
      - "templates/agent.example.json"
      - "scripts/validate_agent_manifest.py"
      - "scripts/verify_agent_probes.py"
      - "scripts/publish_agent_receipt.py"
      - "scripts/install_agent_publication.py"
      - ".github/workflows/vla-runtime-ci.yml"
  pull_request:
    paths:
      - "vla_runtime/**"
      - "templates/AGENT_CAPABILITY_MANIFEST.schema.json"
      - "templates/AGENT_VERIFICATION_RECEIPT.schema.json"
      - "templates/agent.example.json"
      - "scripts/validate_agent_manifest.py"
      - "scripts/verify_agent_probes.py"
      - "scripts/publish_agent_receipt.py"
      - "scripts/install_agent_publication.py"
      - ".github/workflows/vla-runtime-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./vla_runtime pytest jsonschema
      - name: Compile runtime
        run: python -m compileall -q vla_runtime scripts
      - name: Validate agent capability contract
        run: python scripts/validate_agent_manifest.py
      - name: Verify production agent capability probes
        run: python scripts/verify_agent_probes.py
      - name: Validate agent verification receipt contract
        run: |
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.load(open('templates/AGENT_VERIFICATION_RECEIPT.schema.json'))
          receipt = json.load(open('artifacts/agent-verification-receipt.json'))
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(receipt)
          print('Agent verification receipt valid')
          PY
      - name: Build deployable agent verification receipt
        run: python scripts/publish_agent_receipt.py
      - name: Verify static-host publication adapter
        run: |
          python scripts/install_agent_publication.py artifacts/agent-publication artifacts/static-host-smoke
          cmp artifacts/agent-publication/.well-known/agent-verification.json artifacts/static-host-smoke/.well-known/agent-verification.json
      - name: Publish agent verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-verification-receipt-${{ github.sha }}
          path: |
            artifacts/agent-verification-receipt.json
            artifacts/agent-publication/.well-known/agent-verification.json
          if-no-files-found: error
          retention-days: 90
      - name: Run runtime tests
        working-directory: vla_runtime
        env:
          PYTHONPATH: .
        run: pytest -q evals/test_approvals.py evals/test_entry_modes.py evals/test_intelligence.py evals/test_agent_economy.py evals/test_model_gateway.py evals/test_provider_agent.py evals/test_v2_runtime.py
